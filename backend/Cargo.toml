[package]
name = "nodeflare"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Server monitoring system with WebSocket support"
repository = "https://github.com/imengying/NodeFlare"

[[bin]]
name = "nodeflare"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "sqlite-bundled", "postgres", "migrate", "macros"] }
toml = "1.1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
time = "0.3"
sha2 = "0.11"
pbkdf2 = "0.13"
totp-lite = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
argon2 = "0.6"
rand = "0.10"
hex = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
data-encoding = "2"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
ipnet = { version = "2", features = ["serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
