[package]
name = "nodeflare"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Server monitoring system with WebSocket support"
repository = "https://github.com/imengying/NodeFlare"

[[bin]]
name = "nodeflare"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "sqlite-bundled", "postgres", "migrate", "macros", "json"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
sha2 = "0.11"
pbkdf2 = "0.13"
totp-lite = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
data-encoding = "2"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
