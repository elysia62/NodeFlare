[package]
name = "nodeflare-agent"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Independent Rust telemetry agent for NodeFlare"
repository = "https://github.com/imengying/NodeFlare"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
httpdate = "1"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
url = "2.5"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "freebsd"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
